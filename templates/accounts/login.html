{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="login-page">
	<div class="container">
		<div class="card site-surface border-0">
			<div class="card-body">
				<h4 class="card-title mb-3 text-center">Sign in</h4>
				{% if error %}
					<div class="alert alert-danger" role="alert">{{ error }}</div>
				{% endif %}
				<form method="post" novalidate>
					{% csrf_token %}
					<div class="mb-3">
						<label for="id_username" class="form-label">Username</label>
						<input type="text" name="username" id="id_username" class="form-control" required autofocus>
					</div>
					<div class="mb-3">
						<label for="id_password" class="form-label">Password</label>
						<input type="password" name="password" id="id_password" class="form-control" required>
					</div>
					<div class="d-flex justify-content-between align-items-center mb-3">
						<div class="form-check">
							<input class="form-check-input" type="checkbox" value="" id="remember" name="remember">
							<label class="form-check-label" for="remember">Remember me</label>
						</div>
						<a href="#" class="small">Forgot password?</a>
					</div>
					<div class="d-grid">
						<button type="submit" class="btn btn-primary">Login</button>
					</div>
				</form>
				<hr>
				<p class="text-center small mb-0">Don't have an account? <a href="{% url 'register' %}">Register</a></p>
			</div>
		</div>
	</div>
</div>

<style>
	.login-page {
		padding: 3rem 0;
	}

	.login-page .card {
		max-width: 420px;
		margin: 0 auto;
		border-radius: 18px;
	}

	.login-page .card-title {
		color: #2c241a;
	}
</style>

{% endblock %}
