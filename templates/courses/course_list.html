{% extends 'base.html' %}

{% block title %}Courses{% endblock %}

{% block content %}
<div class="container">
	<div class="d-flex align-items-center justify-content-between mb-4">
		<h2 class="mb-0">Courses</h2>
	</div>

	<div class="course-grid">
		{% for course in courses %}
			<article class="course-card">
				<a
					class="course-thumb{% if not course.img %} no-image{% endif %}"
					href="{% url 'course_detail' course.course_id %}"
					{% if course.img %}style="background-image: url('{{ course.img.url }}');"{% endif %}
				>
				</a>
				<div class="course-meta">
					<h3><a href="{% url 'course_detail' course.course_id %}">{{ course.title }}</a></h3>
					<p>{{ course.description|truncatechars:140 }}</p>
				</div>
			</article>
		{% empty %}
			<div class="alert alert-secondary">No courses available yet.</div>
		{% endfor %}
	</div>
</div>

<style>
	.course-grid {
		display: grid;
		grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
		gap: 1.5rem;
	}

	.course-card {
		overflow: visible;
		transition: transform 0.2s ease, box-shadow 0.2s ease;
	}

	.course-thumb {
		position: relative;
		display: flex;
		align-items: flex-end;
		min-height: 220px;
		border-radius: 16px 16px 0 0;
		text-decoration: none;
		background-size: cover;
		background-position: center;
		background-color: #1a1f2b;
		box-shadow: 0 12px 24px rgba(0, 0, 0, 0.25);
		transition: transform 0.2s ease, box-shadow 0.2s ease;
		border: 1px solid rgba(255, 255, 255, 0.12);
		border-bottom: none;
	}

	.course-thumb.no-image {
		background-image: linear-gradient(135deg, #1b2735, #2b4162);
	}

	.course-card:hover {
		transform: translateY(-6px);
	}

	.course-card:hover .course-thumb {
		box-shadow: 0 18px 34px rgba(56, 189, 248, 0.25);
		border-color: rgba(56, 189, 248, 0.45);
	}

	.course-meta {
		padding: 1.1rem 1.25rem 1.25rem;
		color: #f8fafc;
		background: #0f172a;
		border: 1px solid rgba(255, 255, 255, 0.12);
		border-top: none;
		border-radius: 0 0 16px 16px;
		box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
		min-height: 144px;
	}

	.course-card:hover .course-meta {
		border-color: rgba(56, 189, 248, 0.45);
	}

	.course-meta h3 {
		margin: 0 0 0.5rem;
		font-size: 1.15rem;
		display: -webkit-box;
		-webkit-box-orient: vertical;
		-webkit-line-clamp: 2;
		overflow: hidden;
	}

	.course-meta h3 a {
		color: inherit;
		text-decoration: none;
	}

	.course-meta h3 a:hover {
		text-decoration: underline;
	}

	.course-meta p {
		margin: 0;
		font-size: 0.9rem;
		opacity: 0.85;
		display: -webkit-box;
		-webkit-box-orient: vertical;
		-webkit-line-clamp: 3;
		overflow: hidden;
	}

	@media (max-width: 576px) {
		.course-thumb {
			min-height: 190px;
		}
	}
</style>
{% endblock %}
